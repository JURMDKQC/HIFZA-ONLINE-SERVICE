<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f6ff;
        }

        /* Profile Photo Box */
        .profile-box {
            width: 220px;
            height: 220px;
            margin: 60px auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
        }

        /* Photo */
        .profile-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Name */
        .name {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #222;
        }

        .work {
            text-align: center;
            font-size: 17px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <!-- =========================
         PROFILE PHOTO
         ========================= -->

    <div class="profile-box">
        <img id="profilePhoto" src="photo1.jpg" alt="Profile Photo">
    </div>

    <div class="name">
        आपका नाम
    </div>

    <div class="work">
        CSC / जन सेवा केंद्र
    </div>


    <!-- =========================
         PHOTO SLIDER JAVASCRIPT
         ========================= -->

    <script>

        // यहां अपनी फोटो के नाम लिखें
        let photos = [
            "photo1.jpg",
            "photo2.jpg",
            "photo3.jpg",
            "photo4.jpg"
        ];

        let currentPhoto = 0;

        // हर 3 सेकंड में फोटो बदलेगी
        setInterval(function() {

            currentPhoto++;

            // आखिरी फोटो के बाद फिर पहली फोटो
            if (currentPhoto >= photos.length) {
                currentPhoto = 0;
            }

            document.getElementById("profilePhoto").src =
                photos[currentPhoto];

        }, 3000);

    </script>

</body>
</html>
